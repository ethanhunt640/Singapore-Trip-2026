<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  /* pastel palette */
  --sea:#8FB9C9;
  --sea-dark:#5E8FA3;
  --sun:#F6D397;
  --coral:#F3A79B;
  --leaf:#A8C9A1;
  --leaf-dark:#7FA878;
  --sand:#FBF4EC;
  --ink:#4A4440;
  --card:#FFFFFF;
}
:root[data-theme="dark"]{
  --sea:#8FD3E0; --sea-dark:#79B9C7; --sun:#E8C488; --coral:#E8A79B;
  --leaf:#9FCB98; --leaf-dark:#8CBF85;
  --sand:#2A2622; --ink:#EFEAE4; --card:#332E29;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --sea:#8FD3E0; --sea-dark:#79B9C7; --sun:#E8C488; --coral:#E8A79B;
    --leaf:#9FCB98; --leaf-dark:#8CBF85;
    --sand:#2A2622; --ink:#EFEAE4; --card:#332E29;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
  background:
    radial-gradient(circle at 10% 0%, color-mix(in srgb, var(--sun) 35%, transparent) 0%, transparent 45%),
    radial-gradient(circle at 90% 10%, color-mix(in srgb, var(--sea) 30%, transparent) 0%, transparent 40%),
    linear-gradient(180deg,var(--sand) 0%,var(--sand) 100%);
  min-height:100%;
  padding-bottom:2rem;
  font-size:19.2px;
  transition:background .2s,color .2s;
}
header{
  padding:1.65rem 1.5rem .6rem;
  padding-top:calc(1.65rem + env(safe-area-inset-top,0px));
  position:sticky;top:0;z-index:5;
  background:var(--sand);
}
.headrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
header h1{margin:0;font-size:21.6px;display:flex;align-items:center;gap:8px;font-weight:700;color:var(--sea-dark);}
header p{margin:.3rem 0 0;font-size:14.4px;opacity:.65;}
#themeBtn{
  background:none;border:none;font-size:19.2px;cursor:pointer;padding:2px 4px;line-height:1;
  color:var(--ink);opacity:.7;
}
.tabs{display:flex;gap:2.1rem;margin:1.35rem 0 0;border-bottom:1px solid rgba(0,0,0,.1);}
.tab{
  padding:0 0 13px;font-size:16px;font-weight:600;color:inherit;opacity:.5;
  cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;
}
.tab.active{opacity:1;color:var(--sea-dark);border-bottom-color:var(--coral);}
main{max-width:620px;margin:0 auto;padding:.45rem 1.5rem 1.5rem;}
section{display:none;}
section.active{display:block;}
.day{padding:1.5rem 0;border-bottom:1px solid rgba(0,0,0,.08);}
.day:last-child{border-bottom:none;}
.day h2{margin:0 0 3px;font-size:18px;color:var(--sea-dark);font-weight:700;}
.day .loc{font-size:13.6px;color:var(--coral);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:.75rem;}
.item{display:flex;gap:15px;padding:6px 0;font-size:16px;}
.item .t{flex:0 0 87px;color:var(--leaf-dark);font-weight:700;font-size:14.4px;}
.item .d{flex:1;}
.meal{margin-top:1.05rem;}
.meal h4{margin:0 0 4px;font-size:13.6px;text-transform:uppercase;letter-spacing:.04em;opacity:.55;font-weight:700;}
.meal div{font-size:15.6px;margin-bottom:4px;line-height:1.4;}
.meal ul{margin:0 0 .75rem;padding-left:1.4rem;}
.meal li{font-size:15.6px;line-height:1.45;margin-bottom:4px;}
.veg{color:var(--leaf-dark);font-weight:700;font-size:14.4px;text-transform:uppercase;letter-spacing:.03em;}
.chk{color:var(--coral);font-weight:700;font-size:14.4px;text-transform:uppercase;letter-spacing:.03em;}
.rcard{margin:0 0 .9rem;padding:.7rem 0;border-bottom:1px dashed rgba(0,0,0,.08);}
.rcard:last-child{border-bottom:none;}
.rname{font-size:16.8px;font-weight:700;color:var(--sea-dark);margin-bottom:2px;}
.rnote{font-size:12.8px;opacity:.6;margin-bottom:5px;line-height:1.4;}
.rcard div.veg,.rcard div.chk{display:inline;}
.rcard>div:not(.rname):not(.rnote){font-size:14.4px;margin-bottom:2px;line-height:1.4;}
a{color:var(--sea-dark);text-decoration:underline;text-decoration-color:color-mix(in srgb, var(--sea-dark) 40%, transparent);}
.cat{margin-bottom:1.65rem;}
.cat h3{font-size:16.8px;color:var(--sea-dark);margin:0 0 .75rem;font-weight:700;border-bottom:1px solid rgba(0,0,0,.08);padding-bottom:7px;}

  display:flex;align-items:flex-start;gap:13px;padding:10px 0;font-size:16px;

.citem input{margin-top:3px;width:25px;height:25px;accent-color:var(--leaf-dark);flex:0 0 25px;}
.citem.done label{text-decoration:line-through;opacity:.5;}
.citem label{flex:1;}
.progress{margin-bottom:1.5rem;font-size:14.4px;opacity:.75;}
.bar{height:5px;background:rgba(0,0,0,.08);margin-top:9px;overflow:hidden;border-radius:3px;}

footer{text-align:center;font-size:13.2px;color:var(--ink);opacity:.45;padding:1.5rem;}

.ticker{

.ticker-item{flex:0 0 auto;display:flex;align-items:baseline;gap:7px;white-space:nowrap;}
.ticker-item .city{font-weight:700;font-size:14.4px;color:var(--sea-dark);}

.ticker-item .desc{font-size:12px;opacity:.6;}
.snapnote{font-size:10.8px;opacity:.5;margin:.3rem 0 0;line-height:1.4;}
.fx{margin-top:1rem;padding-top:.9rem;border-top:1px solid rgba(0,0,0,.08);}
.fx-row{display:flex;align-items:center;gap:8px;margin-bottom:.6rem;}
.fx-row label{font-size:12px;font-weight:700;color:var(--sea-dark);flex:0 0 42px;}

  font-family:inherit;
}
.fx-row input[readonly]{background:color-mix(in srgb, var(--leaf) 18%, var(--card));font-weight:700;border-color:transparent;}
.fx-eq{font-size:14.4px;opacity:.5;flex:0 0 auto;}
</style>

<script>
const THEME_KEY='trip_theme';
function applyTheme(t){
  if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}
  else if(t==='light'){document.documentElement.setAttribute('data-theme','light');}
  else {document.documentElement.removeAttribute('data-theme');}
  const btn=document.getElementById('themeBtn');
  const isDark = t==='dark' || (t!=='light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  if(btn) btn.textContent = isDark ? '☀️' : '🌙';
}
let savedTheme = null;
try{ savedTheme = localStorage.getItem(THEME_KEY); }catch(e){}
applyTheme(savedTheme);
document.getElementById('themeBtn').addEventListener('click', ()=>{
  const current = document.documentElement.getAttribute('data-theme');
  const isDarkNow = current==='dark' || (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const next = isDarkNow ? 'light' : 'dark';
  applyTheme(next);
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
});
</script>

function renderItin(){
  const el = document.getElementById('itin');
  el.innerHTML = itinerary.map(d => `
    <div class="day">
      <div class="loc">${d.loc}</div>
      <h2>${d.date}</h2>
      ${d.items.map(i=>`<div class="item"><div class="t">${i[0]}</div><div class="d">${i[1]}</div></div>`).join('')}
    </div>`).join('');
}

function renderFood(){
  const el = document.getElementById('food');
  const mealOrder = ['breakfast','lunch','dinner'];
  el.innerHTML = itinerary.filter(d=>d.meals && Object.keys(d.meals).length).map(d => {
    const meals = mealOrder.filter(m=>d.meals[m]).map(m=>{
      const mm = d.meals[m];
      const cards = mm.restaurants.map(r=>{
        const nameHtml = r.link ? `<a href="${r.link}" target="_blank">${r.name}</a>` : r.name;
        return `<div class="rcard">
          <div class="rname">${nameHtml}</div>
          ${r.note ? `<div class="rnote">${r.note}</div>` : ''}
          <div><span class="veg">Veg pick:</span> ${r.veg}</div>
          <div><span class="chk">Chicken pick:</span> ${r.chk}</div>
        </div>`;
      }).join('');
      return `<div class="meal">
        <h4>${m}</h4>
        ${cards}
      </div>`;
    }).join('');
    return `<div class="day">
      <div class="loc">${d.loc}</div>
      <h2>${d.date}</h2>
      ${meals}
    </div>`;
  }).join('');
}

const STORE_KEY = 'trip_checklist_state';
function loadState(){ try{return JSON.parse(localStorage.getItem(STORE_KEY)||'{}');}catch(e){return {};} }
function saveState(s){ try{localStorage.setItem(STORE_KEY, JSON.stringify(s));}catch(e){} }
let state = loadState();

function renderCheck(){
  const el = document.getElementById('checkList');
  let total=0, done=0;
  el.innerHTML = checklist.map((c,ci)=>{
    const items = c.items.map((t,ii)=>{
      const key = ci+'-'+ii;
      const checked = !!state[key];
      total++; if(checked) done++;
      return `<div class="citem ${checked?'done':''}">
        <input type="checkbox" id="c${key}" data-key="${key}" ${checked?'checked':''}>
        <label for="c${key}">${t}</label>
      </div>`;
    }).join('');
    return `<div class="cat"><h3>${c.cat}</h3>${items}</div>`;
  }).join('');
  document.getElementById('progTxt').textContent = `${done} of ${total} done`;
  document.getElementById('progBar').style.width = (total?Math.round(done/total*100):0)+'%';

  el.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const key = e.target.dataset.key;
      state[key] = e.target.checked;
      saveState(state);
      renderCheck();
    });
  });
}

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('main section').forEach(s=>s.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab).classList.add('active');
  });
});

// ---- Live weather (Open-Meteo, no key required) ----
const weatherCities = [
  {city:"Sydney", lat:-33.8688, lon:151.2093},
  {city:"Singapore", lat:1.3521, lon:103.8198},
  {city:"Penang", lat:5.4141, lon:100.3288},
  {city:"Kuala Lumpur", lat:3.1390, lon:101.6869}
];
const wmoDesc = {
  0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Overcast",
  45:"Foggy",48:"Foggy",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",
  61:"Light rain",63:"Rain",65:"Heavy rain",71:"Light snow",73:"Snow",75:"Heavy snow",
  80:"Rain showers",81:"Rain showers",82:"Violent showers",
  95:"Thunderstorm",96:"Thunderstorm",99:"Thunderstorm"
};
async function loadWeather(){
  const el = document.getElementById('weatherTicker');
  const note = document.getElementById('weatherNote');
  try{
    const results = await Promise.all(weatherCities.map(async c=>{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,weather_code&timezone=auto`;
      const res = await fetch(url);
      if(!res.ok) throw new Error('weather fetch failed');
      const data = await res.json();
      const temp = Math.round(data.current.temperature_2m);
      const desc = wmoDesc[data.current.weather_code] || "—";
      return {city:c.city, temp:`${temp}°C`, desc};
    }));
    el.innerHTML = results.map(w=>
      `<div class="ticker-item"><span class="city">${w.city}</span><span class="temp">${w.temp}</span><span class="desc">${w.desc}</span></div>`
    ).join('');
    note.textContent = "Live weather, updated just now.";
  }catch(e){
    el.innerHTML = `<div class="ticker-item"><span class="desc">Couldn't load live weather — check your connection.</span></div>`;
    note.textContent = "Live weather unavailable right now.";
  }
}
loadWeather();

// ---- Live exchange rates (Frankfurter.app, ECB rates, no key required) ----
// Fallback rates below are a snapshot taken Oct 9, 2026, used only if the live fetch fails,
// so the converter still works (just not with today's exact rate) instead of going dead.
const FALLBACK_SGD_PER_AUD = 0.8919;
const FALLBACK_MYR_PER_AUD = 2.74;
const FALLBACK_DATE = "Oct 9, 2026";

let AUD_PER_SGD = 1/FALLBACK_SGD_PER_AUD;
let AUD_PER_MYR = 1/FALLBACK_MYR_PER_AUD;

async function loadFx(){
  const note = document.getElementById('fxNote');
  try{
    const res = await fetch('https://api.frankfurter.app/latest?base=AUD&symbols=SGD,MYR');
    if(!res.ok) throw new Error('fx fetch failed');
    const data = await res.json();
    const sgdPerAud = data.rates.SGD;
    const myrPerAud = data.rates.MYR;
    AUD_PER_SGD = 1/sgdPerAud;
    AUD_PER_MYR = 1/myrPerAud;
    note.textContent = `Live rate: 1 AUD ≈ ${sgdPerAud.toFixed(4)} SGD, 1 AUD ≈ ${myrPerAud.toFixed(4)} MYR (ECB, updated ${data.date}).`;
  }catch(e){
    console.error('FX fetch error:', e);
    // Fall back to the snapshot rates set above — conversion keeps working, just not with today's live rate
    AUD_PER_SGD = 1/FALLBACK_SGD_PER_AUD;
    AUD_PER_MYR = 1/FALLBACK_MYR_PER_AUD;
    note.textContent = `Couldn't fetch live rates — using a fallback snapshot from ${FALLBACK_DATE} (1 AUD ≈ ${FALLBACK_SGD_PER_AUD} SGD, 1 AUD ≈ ${FALLBACK_MYR_PER_AUD} MYR). Reload to try live rates again.`;
  }
  // re-run any pending conversions with whichever rates are now set (live or fallback)
  recalcFx();
}
function wireFx(inputId, outputId, getRate){
  const inp = document.getElementById(inputId);
  const out = document.getElementById(outputId);
  inp.addEventListener('input', ()=>{
    const v = parseFloat(inp.value);
    const rate = getRate();
    out.value = (isNaN(v) || !rate) ? '' : (v*rate).toFixed(2);
  });
}
function recalcFx(){
  document.getElementById('sgdIn').dispatchEvent(new Event('input'));
  document.getElementById('myrIn').dispatchEvent(new Event('input'));
}
wireFx('sgdIn','sgdOut', ()=>AUD_PER_SGD);
wireFx('myrIn','myrOut', ()=>AUD_PER_MYR);
loadFx();

renderItin();
renderFood();
renderCheck();
</script>
